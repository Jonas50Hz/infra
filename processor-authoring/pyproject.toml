[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wama-processor-authoring"
version = "0.1.1"
description = "Validated authoring tools for WAMA processor repositories"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.scripts]
wama-processor = "wama_processor_authoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]