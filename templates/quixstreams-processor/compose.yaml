services:
  processor-template:
    image: "${WAMA_IMAGE_PREFIX:-wama.local/wama}/processor-template:${WAMA_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: templates/quixstreams-processor/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      PROCESSOR_CONFIG_PATH: /etc/wama/processor.yaml
    volumes:
      - type: bind
        source: ${PROCESSOR_TEMPLATE_CONFIG_SOURCE:-./processor.yaml}
        target: /etc/wama/processor.yaml
        read_only: true
    restart: unless-stopped