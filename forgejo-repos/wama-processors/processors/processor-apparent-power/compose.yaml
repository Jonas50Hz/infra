services:
  processor-apparent-power:
    image: "${WAMA_PROCESSORS_IMAGE_PREFIX:-wama.local/wama-processors}/processor-apparent-power:${WAMA_PROCESSORS_IMAGE_TAG:-main}"
    build:
      context: ../..
      dockerfile: processors/processor-apparent-power/Dockerfile
    environment:
      PROCESSOR_CONFIG_PATH: /etc/wama/processor.yaml
    volumes:
      - type: bind
        source: ${PROCESSOR_APPARENT_POWER_CONFIG_SOURCE:-./processor.yaml}
        target: /etc/wama/processor.yaml
        read_only: true
    networks:
      - wama-infra
    restart: unless-stopped

networks:
  wama-infra:
    external: true
    name: ${WAMA_INFRA_NETWORK:-wama-infra}