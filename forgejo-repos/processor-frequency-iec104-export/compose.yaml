name: ${WAMA_PROCESSOR_COMPOSE_PROJECT_NAME:-wama-processor-frequency-iec104-export}

services:
  processor-frequency-iec104-export:
    image: "${WAMA_PROCESSOR_IMAGE:-wama.local/processor-frequency-iec104-export:main}"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FREQUENCY_IEC104_CAUSE_CODE: "${FREQUENCY_IEC104_CAUSE_CODE:-3}"
      FREQUENCY_IEC104_COMMON_ADDRESS: "${FREQUENCY_IEC104_COMMON_ADDRESS:-1}"
      FREQUENCY_IEC104_INFORMATION_OBJECT_ADDRESS: "${FREQUENCY_IEC104_INFORMATION_OBJECT_ADDRESS:-1001}"
      FREQUENCY_IEC104_SOURCE_MRID: "${FREQUENCY_IEC104_SOURCE_MRID:-urn:wama:poc:pmu:bay-01:frequency}"
      WAMA_INPUT_TOPIC: "${WAMA_INPUT_TOPIC:-LiveMeasurement}"
      WAMA_KAFKA_BOOTSTRAP_SERVERS: "${WAMA_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      WAMA_OUTPUT_TOPIC: "${WAMA_OUTPUT_TOPIC:-Export}"
      WAMA_PROCESSOR_CONSUMER_GROUP: "${WAMA_PROCESSOR_CONSUMER_GROUP:-processor-frequency-iec104-export}"
    networks:
      - wama-infra
    restart: unless-stopped

networks:
  wama-infra:
    external: true
    name: ${WAMA_INFRA_NETWORK:-wama-infra}