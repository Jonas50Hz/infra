name: Validate and deploy processor-alarm-threshold

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_legacy_active_alarm_recovery:
        description: Type CONFIRM_LEGACY_ACTIVE_ALARM_RECOVERY to authorize the one-time watermark recovery handoff.
        required: false
        type: string

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: wama-processors-ci
    timeout-minutes: 20
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test deployment guard
        run: python3 -m unittest discover -s tooling-tests -v
      - name: Test processor
        run: docker build --target test --file Dockerfile .

  publish:
    needs: validate
    if: forgejo.ref == 'refs/heads/main'
    runs-on: wama-processors-ci
    timeout-minutes: 30
    outputs:
      image: ${{ steps.registry.outputs.image }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: registry
        name: Resolve processor image
        run: |
          registry="${FORGEJO_SERVER_URL#https://}"
          registry="${registry#http://}"
          registry="${registry%/}"
          if [[ "$registry" == host.docker.internal:* ]]; then
            registry="127.0.0.1:${registry#host.docker.internal:}"
          fi
          repository="$(printf '%s' "$FORGEJO_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "registry=$registry" >> "$FORGEJO_OUTPUT"
          echo "image=$registry/$repository/processor-alarm-threshold" >> "$FORGEJO_OUTPUT"
      - name: Authenticate to Forgejo Packages
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
        run: |
          : "${FORGEJO_PROCESSORS_PACKAGE_USERNAME:?Package username is not configured}"
          : "${FORGEJO_PROCESSORS_PACKAGE_TOKEN:?Package token is not configured}"
          printf '%s' "$FORGEJO_PROCESSORS_PACKAGE_TOKEN" | docker login "$REGISTRY" --username "$FORGEJO_PROCESSORS_PACKAGE_USERNAME" --password-stdin
      - name: Build and publish processor
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY" \
            --label "org.opencontainers.image.revision=$FORGEJO_SHA" \
            --tag "$IMAGE:sha-$FORGEJO_SHA" \
            --tag "$IMAGE:main" \
            --file Dockerfile \
            .
          docker push "$IMAGE:sha-$FORGEJO_SHA"
          docker push "$IMAGE:main"

  deploy:
    needs:
      - validate
      - publish
    if: forgejo.ref == 'refs/heads/main'
    runs-on: wama-processors-deploy
    timeout-minutes: 20
    concurrency:
      group: wama-processor-alarm-threshold-deploy
      cancel-in-progress: false
    env:
      WAMA_PROCESSOR_DEPLOY_ROOT: /var/lib/wama-processor-alarm-threshold
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Authenticate to Forgejo Packages
        run: |
          registry="${FORGEJO_SERVER_URL#https://}"
          registry="${registry#http://}"
          registry="${registry%/}"
          if [[ "$registry" == host.docker.internal:* ]]; then
            registry="127.0.0.1:${registry#host.docker.internal:}"
          fi
          : "${FORGEJO_PROCESSORS_PACKAGE_USERNAME:?Package username is not configured}"
          : "${FORGEJO_PROCESSORS_PACKAGE_TOKEN:?Package token is not configured}"
          printf '%s' "$FORGEJO_PROCESSORS_PACKAGE_TOKEN" | docker login "$registry" --username "$FORGEJO_PROCESSORS_PACKAGE_USERNAME" --password-stdin
      - name: Synchronize and deploy processor-alarm-threshold
        env:
          WAMA_WORKFLOW_EVENT_NAME: ${{ forgejo.event_name }}
          WAMA_LEGACY_ACTIVE_ALARM_RECOVERY_CONFIRMATION: ${{ forgejo.event.inputs.confirm_legacy_active_alarm_recovery }}
        run: |
          deployment_arguments=(
            --commit "$FORGEJO_SHA"
            --image "${{ needs.publish.outputs.image }}:main"
            --project-name wama-processor-alarm-threshold
          )
          if [[ "$WAMA_WORKFLOW_EVENT_NAME" == "workflow_dispatch" ]] && \
            [[ "$WAMA_LEGACY_ACTIVE_ALARM_RECOVERY_CONFIRMATION" == "CONFIRM_LEGACY_ACTIVE_ALARM_RECOVERY" ]]; then
            deployment_arguments+=(--allow-legacy-active-alarm-bootstrap)
          fi
          python3 scripts/deploy_processor.py "${deployment_arguments[@]}"