cases:
  - name: nominal frequency conversion
    inputs:
      frequency_hz:
        value: 50.01
        valid: true
        timestamp_ms: 1000
    expect:
      frequency_millihertz:
        value: 50010.0
        unit: mHz
        timestamp_ms: 1000
  - name: invalid quality produces no result
    inputs:
      frequency_hz:
        value: 50.01
        valid: false
        timestamp_ms: 1000
    expect: no_output
  - name: non-finite frequency produces no result
    inputs:
      frequency_hz:
        value: .inf
        valid: true
        timestamp_ms: 1000
    expect: no_output