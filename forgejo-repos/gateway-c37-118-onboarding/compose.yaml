name: ${WAMA_GATEWAY_ONBOARDING_COMPOSE_PROJECT_NAME:-wama-gateway-c37-118-onboarding}

services:
  masterdata-publisher:
    image: "${WAMA_MASTERDATA_PUBLISHER_IMAGE:-wama.local/gateway-c37-118-onboarding:main}"
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "gateway_c37_118_onboarding.main"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      WAMA_MASTERDATA_CATALOG_DIRECTORY: /app/catalog/sources
      WAMA_MASTERDATA_CATALOG_ID: "${WAMA_MASTERDATA_CATALOG_ID:-wama-c37-118-onboarding}"
      WAMA_MASTERDATA_CATALOG_REVISION: "${WAMA_MASTERDATA_CATALOG_REVISION:-development}"
      WAMA_MASTERDATA_TOPIC: "${WAMA_MASTERDATA_TOPIC:-Masterdata}"
    networks:
      - wama-infra
    restart: "no"

networks:
  wama-infra:
    external: true
    name: ${WAMA_INFRA_NETWORK:-wama-infra}