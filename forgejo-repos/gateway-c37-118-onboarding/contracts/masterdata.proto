syntax = "proto3";

package wama.masterdata.v1;

import "google/protobuf/timestamp.proto";

// Latest runtime configuration for one source. Non-null values are keyed by
// source_id on the compacted Masterdata topic. A null-valued record with that
// key decommissions the source from the runtime projection.
message SourceMasterdata {
    // Stable identifier used as the Kafka key and deployment identity.
    string source_id = 1;

    // Identity and Git revision of the catalog that published this record.
    string catalog_id = 2;
    string catalog_revision = 3;
    google.protobuf.Timestamp published_at = 4;

    SiteLocation location = 5;

    // V1 supports one C37.118 TCP endpoint per source. Later source protocols
    // can be added as new oneof members without changing this record's key.
    oneof connection {
        C37_118TcpConnection c37_118_tcp = 6;
    }

    // Stable logical signals and their immutable Common Format identities.
    repeated Signal signals = 7;

    reserved 8 to 15;
}

message SiteLocation {
    // Stable, machine-readable site identity.
    string site_id = 1;

    // Human-readable source location name.
    string display_name = 2;
}

message C37_118TcpConnection {
    // Literal IPv4 or IPv6 address. DNS names are not supported in V1.
    string ip_address = 1;

    // TCP port. Catalog validation constrains this to 1 through 65535.
    uint32 port = 2;

    // IEEE C37.118 PMU IDCODE. Catalog validation constrains this to its
    // accepted C37.118 range.
    uint32 pmu_idcode = 3;

    C37_118WireVersion wire_version = 4;
}

message Signal {
    // Stable catalog identifier for this source-local signal.
    string signal_id = 1;

    // Protocol channel identity used by a future gateway to normalize data.
    string source_channel = 2;

    // Explicit immutable identity used as the LiveMeasurement Kafka key.
    string mrid = 3;

    // Common Format scalar field expected for this signal.
    MccsValueKind value_kind = 4;

    // Engineering semantics resolved by consuming services through Masterdata.
    string quantity = 5;
    string unit = 6;

    C37_118V2SignalSelector c37_118_v2_selector = 7;
}

message C37_118V2SignalSelector {
    oneof selector {
        string phasor_magnitude_channel = 1;
        bool frequency = 2;
        bool rocof = 3;
    }
}

enum C37_118WireVersion {
    C37_118_WIRE_VERSION_UNSPECIFIED = 0;
    C37_118_WIRE_VERSION_2 = 2;
}

enum MccsValueKind {
    MCCS_VALUE_KIND_UNSPECIFIED = 0;
    MCCS_VALUE_KIND_DOUBLE = 1;
    MCCS_VALUE_KIND_INT = 2;
    MCCS_VALUE_KIND_UINT = 3;
    MCCS_VALUE_KIND_BOOL = 4;
    MCCS_VALUE_KIND_STRING = 5;
    MCCS_VALUE_KIND_TIMESTAMP = 6;
}