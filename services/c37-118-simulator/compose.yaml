services:
  c37-118-simulator:
    profiles:
      - c37-118
    build:
      context: ../..
      dockerfile: services/c37-118-simulator/Dockerfile
    command:
      - run
      - --profile
      - /etc/c37-118/profile.yaml
    volumes:
      - type: bind
        source: ${C37_118_SIMULATOR_PROFILE_SOURCE:-./profiles/one-pmu.yaml}
        target: /etc/c37-118/profile.yaml
        read_only: true
    expose:
      - "4712-4811"
    networks:
      default:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "c37-118-simulator", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 64m
    pids_limit: 256
    read_only: true
    restart: unless-stopped