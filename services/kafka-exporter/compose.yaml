services:
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
      - --topic.filter=^(LiveMeasurement|MeasurementSession|Alarm|AlarmEvaluationWatermark|Export|Masterdata|Schema|Blobmeta)$
      - --group.filter=.*
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped