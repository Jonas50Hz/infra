services:
  forgejo-init:
    image: codeberg.org/forgejo/forgejo:16.0.2
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      FORGEJO_BOOTSTRAP_ADMIN_EMAIL: "${FORGEJO_BOOTSTRAP_ADMIN_EMAIL:-wama-admin@local}"
      FORGEJO_BOOTSTRAP_ADMIN_PASSWORD: "${FORGEJO_BOOTSTRAP_ADMIN_PASSWORD:-}"
      FORGEJO_BOOTSTRAP_ADMIN_USERNAME: "${FORGEJO_BOOTSTRAP_ADMIN_USERNAME:-wama-admin}"
      FORGEJO_BOOTSTRAP_REPOSITORY: "${FORGEJO_BOOTSTRAP_REPOSITORY:-infra}"
      FORGEJO_RUNNER_URL: "${FORGEJO_RUNNER_URL:-http://host.docker.internal:3000/}"
      WAMA_COMPOSE_PROJECT_NAME: "${WAMA_COMPOSE_PROJECT_NAME:-wama-poc}"
      WAMA_DEPLOY_ROOT: "${WAMA_DEPLOY_ROOT:-/var/lib/wama-deploy}"
    volumes:
      - forgejo-data:/data
      - forgejo-runner-data:/runner
      - ./bootstrap.sh:/opt/wama/bootstrap.sh:ro
      - type: bind
        source: "${WAMA_DEPLOY_ROOT:-/var/lib/wama-deploy}"
        target: "${WAMA_DEPLOY_ROOT:-/var/lib/wama-deploy}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/opt/wama/bootstrap.sh"]
    restart: "no"