services:
  forgejo-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: wama-forgejo-init:local
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      FORGEJO_BOOTSTRAP_ADMIN_EMAIL: "${FORGEJO_BOOTSTRAP_ADMIN_EMAIL:-wama-admin@local}"
      FORGEJO_BOOTSTRAP_ADMIN_PASSWORD: "${FORGEJO_BOOTSTRAP_ADMIN_PASSWORD:-wama-admin}"
      FORGEJO_BOOTSTRAP_ADMIN_USERNAME: "${FORGEJO_BOOTSTRAP_ADMIN_USERNAME:-wama-admin}"
      FORGEJO_GATEWAY_C37_118_ONBOARDING_REPOSITORY: "${FORGEJO_GATEWAY_C37_118_ONBOARDING_REPOSITORY:-gateway-c37-118-onboarding}"
      FORGEJO_GATEWAY_C37_118_ONBOARDING_AGENT_USERNAME: "${FORGEJO_GATEWAY_C37_118_ONBOARDING_AGENT_USERNAME:-wama-gateway-c37-118-onboarding-agent}"
      FORGEJO_GATEWAY_C37_118_ONBOARDING_AGENT_EMAIL: "${FORGEJO_GATEWAY_C37_118_ONBOARDING_AGENT_EMAIL:-wama-gateway-c37-118-onboarding-agent@local}"
      FORGEJO_RUNNER_URL: "${FORGEJO_RUNNER_URL:-http://host.docker.internal:3000/}"
      FORGEJO_INTERNAL_ROOT_URL: "${FORGEJO_INTERNAL_ROOT_URL:-http://forgejo:3000}"
      WAMA_GATEWAY_C37_118_ONBOARDING_DEPLOY_ROOT: "${WAMA_GATEWAY_C37_118_ONBOARDING_DEPLOY_ROOT:-/var/lib/wama-gateway-c37-118-onboarding}"
      WAMA_PROCESSOR_AUTHORING_ROOT: /opt/wama/processor-authoring
      WAMA_PROCESSOR_DEPLOY_BASE_ROOT: "${WAMA_PROCESSOR_DEPLOY_BASE_ROOT:-/var/lib/wama-processors}"
      WAMA_PROCESSOR_REGISTRY_STATUS_PATH: /registry-status/processors.json
      WAMA_INFRA_NETWORK: "${WAMA_INFRA_NETWORK:-wama-infra}"
    volumes:
      - forgejo-data:/data
      - forgejo-runner-data:/runner
      - forgejo-registry-status:/registry-status
      - /var/run/docker.sock:/var/run/docker.sock
      - ./bootstrap-processors.sh:/opt/wama/bootstrap.sh:ro
      - ./processor_registry.py:/opt/wama/processor_registry.py:ro
      - type: bind
        source: ../../forgejo-repos
        target: /opt/wama/seeds
        read_only: true
      - type: bind
        source: ../../processor-authoring
        target: /opt/wama/processor-authoring
        read_only: true
      - type: bind
        source: "${WAMA_PROCESSOR_DEPLOY_BASE_ROOT:-/var/lib/wama-processors}"
        target: "${WAMA_PROCESSOR_DEPLOY_BASE_ROOT:-/var/lib/wama-processors}"
      - type: bind
        source: "${WAMA_GATEWAY_C37_118_ONBOARDING_DEPLOY_ROOT:-/var/lib/wama-gateway-c37-118-onboarding}"
        target: "${WAMA_GATEWAY_C37_118_ONBOARDING_DEPLOY_ROOT:-/var/lib/wama-gateway-c37-118-onboarding}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/opt/wama/bootstrap.sh"]
    restart: "no"