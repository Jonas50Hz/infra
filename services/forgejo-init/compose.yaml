services:
  forgejo-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: wama-forgejo-init:local
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      FORGEJO_BOOTSTRAP_ADMIN_EMAIL: "${FORGEJO_BOOTSTRAP_ADMIN_EMAIL:-wama-admin@local}"
      FORGEJO_BOOTSTRAP_ADMIN_PASSWORD: "${FORGEJO_BOOTSTRAP_ADMIN_PASSWORD:-wama-admin}"
      FORGEJO_BOOTSTRAP_ADMIN_USERNAME: "${FORGEJO_BOOTSTRAP_ADMIN_USERNAME:-wama-admin}"
      FORGEJO_FREQUENCY_SCALE_REPOSITORY: "${FORGEJO_FREQUENCY_SCALE_REPOSITORY:-processor-frequency-scale}"
      FORGEJO_APPARENT_POWER_REPOSITORY: "${FORGEJO_APPARENT_POWER_REPOSITORY:-processor-apparent-power}"
      FORGEJO_FREQUENCY_IEC104_EXPORT_REPOSITORY: "${FORGEJO_FREQUENCY_IEC104_EXPORT_REPOSITORY:-processor-frequency-iec104-export}"
      FORGEJO_FREQUENCY_MEASUREMENT_SESSION_REPOSITORY: "${FORGEJO_FREQUENCY_MEASUREMENT_SESSION_REPOSITORY:-processor-frequency-measurement-session}"
      FORGEJO_ALARM_THRESHOLD_REPOSITORY: "${FORGEJO_ALARM_THRESHOLD_REPOSITORY:-processor-alarm-threshold}"
      FORGEJO_GATEWAY_C37_118_REPOSITORY: "${FORGEJO_GATEWAY_C37_118_REPOSITORY:-gateway-c37-118}"
      FORGEJO_GATEWAY_C37_118_AGENT_USERNAME: "${FORGEJO_GATEWAY_C37_118_AGENT_USERNAME:-wama-gateway-c37-118-agent}"
      FORGEJO_GATEWAY_C37_118_AGENT_EMAIL: "${FORGEJO_GATEWAY_C37_118_AGENT_EMAIL:-wama-gateway-c37-118-agent@local}"
      FORGEJO_RUNNER_URL: "${FORGEJO_RUNNER_URL:-http://host.docker.internal:3000/}"
      WAMA_FREQUENCY_SCALE_DEPLOY_ROOT: "${WAMA_FREQUENCY_SCALE_DEPLOY_ROOT:-/var/lib/wama-processor-frequency-scale}"
      WAMA_APPARENT_POWER_DEPLOY_ROOT: "${WAMA_APPARENT_POWER_DEPLOY_ROOT:-/var/lib/wama-processor-apparent-power}"
      WAMA_FREQUENCY_IEC104_EXPORT_DEPLOY_ROOT: "${WAMA_FREQUENCY_IEC104_EXPORT_DEPLOY_ROOT:-/var/lib/wama-processor-frequency-iec104-export}"
      WAMA_FREQUENCY_MEASUREMENT_SESSION_DEPLOY_ROOT: "${WAMA_FREQUENCY_MEASUREMENT_SESSION_DEPLOY_ROOT:-/var/lib/wama-processor-frequency-measurement-session}"
      WAMA_ALARM_THRESHOLD_DEPLOY_ROOT: "${WAMA_ALARM_THRESHOLD_DEPLOY_ROOT:-/var/lib/wama-processor-alarm-threshold}"
      WAMA_GATEWAY_C37_118_DEPLOY_ROOT: "${WAMA_GATEWAY_C37_118_DEPLOY_ROOT:-/var/lib/wama-gateway-c37-118}"
      WAMA_INFRA_NETWORK: "${WAMA_INFRA_NETWORK:-wama-infra}"
    volumes:
      - forgejo-data:/data
      - forgejo-runner-data:/runner
      - ./bootstrap-processors.sh:/opt/wama/bootstrap.sh:ro
      - type: bind
        source: ../../forgejo-repos/processor-frequency-scale
        target: /opt/wama/seeds/processor-frequency-scale
        read_only: true
      - type: bind
        source: ../../forgejo-repos/processor-apparent-power
        target: /opt/wama/seeds/processor-apparent-power
        read_only: true
      - type: bind
        source: ../../forgejo-repos/processor-frequency-iec104-export
        target: /opt/wama/seeds/processor-frequency-iec104-export
        read_only: true
      - type: bind
        source: ../../forgejo-repos/processor-frequency-measurement-session
        target: /opt/wama/seeds/processor-frequency-measurement-session
        read_only: true
      - type: bind
        source: ../../forgejo-repos/processor-alarm-threshold
        target: /opt/wama/seeds/processor-alarm-threshold
        read_only: true
      - type: bind
        source: ../../forgejo-repos/gateway-c37-118
        target: /opt/wama/seeds/gateway-c37-118
        read_only: true
      - type: bind
        source: "${WAMA_FREQUENCY_SCALE_DEPLOY_ROOT:-/var/lib/wama-processor-frequency-scale}"
        target: "${WAMA_FREQUENCY_SCALE_DEPLOY_ROOT:-/var/lib/wama-processor-frequency-scale}"
      - type: bind
        source: "${WAMA_APPARENT_POWER_DEPLOY_ROOT:-/var/lib/wama-processor-apparent-power}"
        target: "${WAMA_APPARENT_POWER_DEPLOY_ROOT:-/var/lib/wama-processor-apparent-power}"
      - type: bind
        source: "${WAMA_FREQUENCY_IEC104_EXPORT_DEPLOY_ROOT:-/var/lib/wama-processor-frequency-iec104-export}"
        target: "${WAMA_FREQUENCY_IEC104_EXPORT_DEPLOY_ROOT:-/var/lib/wama-processor-frequency-iec104-export}"
      - type: bind
        source: "${WAMA_FREQUENCY_MEASUREMENT_SESSION_DEPLOY_ROOT:-/var/lib/wama-processor-frequency-measurement-session}"
        target: "${WAMA_FREQUENCY_MEASUREMENT_SESSION_DEPLOY_ROOT:-/var/lib/wama-processor-frequency-measurement-session}"
      - type: bind
        source: "${WAMA_ALARM_THRESHOLD_DEPLOY_ROOT:-/var/lib/wama-processor-alarm-threshold}"
        target: "${WAMA_ALARM_THRESHOLD_DEPLOY_ROOT:-/var/lib/wama-processor-alarm-threshold}"
      - type: bind
        source: "${WAMA_GATEWAY_C37_118_DEPLOY_ROOT:-/var/lib/wama-gateway-c37-118}"
        target: "${WAMA_GATEWAY_C37_118_DEPLOY_ROOT:-/var/lib/wama-gateway-c37-118}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/opt/wama/bootstrap.sh"]
    restart: "no"