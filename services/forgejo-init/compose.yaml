services:
  forgejo-init:
    image: codeberg.org/forgejo/forgejo:16.0.2
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      FORGEJO_BOOTSTRAP_ADMIN_EMAIL: "${FORGEJO_BOOTSTRAP_ADMIN_EMAIL:-wama-admin@local}"
      FORGEJO_BOOTSTRAP_ADMIN_PASSWORD: "${FORGEJO_BOOTSTRAP_ADMIN_PASSWORD:-wama-admin}"
      FORGEJO_BOOTSTRAP_ADMIN_USERNAME: "${FORGEJO_BOOTSTRAP_ADMIN_USERNAME:-wama-admin}"
      FORGEJO_PROCESSORS_REPOSITORY: "${FORGEJO_PROCESSORS_REPOSITORY:-wama-processors}"
      FORGEJO_RUNNER_URL: "${FORGEJO_RUNNER_URL:-http://host.docker.internal:3000/}"
      WAMA_PROCESSORS_COMPOSE_PROJECT_NAME: "${WAMA_PROCESSORS_COMPOSE_PROJECT_NAME:-wama-processors}"
      WAMA_PROCESSORS_DEPLOY_ROOT: "${WAMA_PROCESSORS_DEPLOY_ROOT:-/var/lib/wama-processors}"
      WAMA_INFRA_NETWORK: "${WAMA_INFRA_NETWORK:-wama-infra}"
    volumes:
      - forgejo-data:/data
      - forgejo-runner-data:/runner
      - ./bootstrap.sh:/opt/wama/bootstrap.sh:ro
      - type: bind
        source: ../../forgejo-repos/wama-processors
        target: /opt/wama/seed
        read_only: true
      - type: bind
        source: "${WAMA_PROCESSORS_DEPLOY_ROOT:-/var/lib/wama-processors}"
        target: "${WAMA_PROCESSORS_DEPLOY_ROOT:-/var/lib/wama-processors}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/opt/wama/bootstrap.sh"]
    restart: "no"