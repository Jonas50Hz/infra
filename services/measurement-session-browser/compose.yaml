services:
  measurement-session-browser:
    build:
      context: ../..
      dockerfile: services/measurement-session-browser/Dockerfile
    depends_on:
      measurement-session-api:
        condition: service_healthy
    ports:
      - "${MEASUREMENT_SESSION_BROWSER_PORT:-3002}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped