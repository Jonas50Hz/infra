services:
  measurement-session-api:
    build:
      context: ../..
      dockerfile: services/measurement-session-api/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: measurement-session-catalog-api
      KAFKA_TOPIC: MeasurementSession
      POSTGRES_DSN: postgresql://wama:wama-postgres-password@postgres:5432/wama
      S3_ACCESS_KEY_ID: wama-s3-admin
      S3_BUCKET: wama-measurement-sessions
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: wama-s3-admin-secret
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped