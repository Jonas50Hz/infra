global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: victoria-metrics
    static_configs:
      - targets: ["victoria-metrics:8428"]
        labels:
          component: metrics-storage
          stack: wama-poc

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          component: dashboards
          stack: wama-poc

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: host-metrics
          stack: wama-poc

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          component: container-metrics
          stack: wama-poc

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          component: kafka-observability
          stack: wama-poc