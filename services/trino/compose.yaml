services:
  trino:
    image: trinodb/trino:483
    depends_on:
      druid:
        condition: service_healthy
      druid-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      trino-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    env_file:
      - ./trino.env
    ports:
      - "8085:8080"
    volumes:
      - ./etc/config.properties:/etc/trino/config.properties:ro
      - ./etc/node.properties:/etc/trino/node.properties:ro
      - ./etc/access-control.properties:/etc/trino/access-control.properties:ro
      - ./etc/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/v1/info | grep --quiet '\"starting\":false'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped