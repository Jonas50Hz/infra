connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=wama_sessions
iceberg.jdbc-catalog.schema-version=V1
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/wama?currentSchema=iceberg_catalog
iceberg.jdbc-catalog.connection-user=trino_session_reader
iceberg.jdbc-catalog.connection-password=${ENV:TRINO_SESSION_READER_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://wama-measurement-sessions/iceberg
iceberg.security=READ_ONLY
fs.s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:TRINO_S3_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:TRINO_S3_SECRET_ACCESS_KEY}