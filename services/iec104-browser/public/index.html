<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAMA IEC 104 Monitor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-lockup">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="eyebrow">WAMA / Control Center</p>
        <h1>IEC 104 Live Monitor</h1>
      </div>
    </div>
    <p class="connection-state" id="connection-state" aria-live="polite">Opening monitor</p>
  </header>

  <main class="workspace">
    <section class="event-log" aria-labelledby="event-log-title">
      <div class="log-heading">
        <div>
          <p class="eyebrow">Wire-received values</p>
          <h2 id="event-log-title">Monitor Stream</h2>
        </div>
        <label class="filter-field">
          <span class="visually-hidden">Filter received values</span>
          <input id="event-filter" type="search" placeholder="Filter CA, IOA, type, or value" autocomplete="off">
        </label>
      </div>
      <div class="table-wrap" tabindex="0">
        <table>
          <thead>
            <tr>
              <th scope="col">Received UTC</th>
              <th scope="col">CA</th>
              <th scope="col">IOA</th>
              <th scope="col">Type</th>
              <th scope="col">Value</th>
              <th scope="col">COT</th>
              <th scope="col">Quality</th>
            </tr>
          </thead>
          <tbody id="event-rows"></tbody>
        </table>
        <p class="table-state" id="table-state" aria-live="polite">Waiting for IEC 104 values.</p>
      </div>
      <div class="log-footer">
        <p id="event-count" aria-live="polite">0 received in this view</p>
        <p class="transient-note">Clears when this page closes</p>
      </div>
    </section>

    <aside class="detail-panel" aria-labelledby="detail-title">
      <div class="detail-heading">
        <p class="eyebrow">Selected ASDU</p>
        <h2 id="detail-title">No Value Selected</h2>
      </div>
      <div class="detail-content" id="detail-content" aria-live="polite"></div>
    </aside>
  </main>

  <template id="empty-detail-template">
    <p class="empty-detail">Select a received value from the monitor stream.</p>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
