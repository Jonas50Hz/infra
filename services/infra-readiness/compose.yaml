services:
  infra-readiness:
    build:
      context: ../..
      dockerfile: services/infra-readiness/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      kafka-exporter:
        condition: service_started
      kafka-ui:
        condition: service_started
      gateway-dashboard-provisioner:
        condition: service_healthy
      iec104-exporter:
        condition: service_healthy
      iec104-browser:
        condition: service_healthy
      measurement-session-api:
        condition: service_healthy
      measurement-session-exporter:
        condition: service_healthy
      druid:
        condition: service_healthy
      druid-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      alerta-postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      alerta:
        condition: service_healthy
      alarm-alerta-ingress:
        condition: service_healthy
      trino-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
      trino-session-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      forgejo:
        condition: service_healthy
      forgejo-init:
        condition: service_completed_successfully
      forgejo-runner:
        condition: service_started
      victoria-metrics:
        condition: service_healthy
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
      grafana:
        condition: service_healthy
    env_file:
      - ../grafana/grafana.env
    environment:
      ALERTA_URL: http://alerta:8080
      FORGEJO_ADMIN_PASSWORD: "${FORGEJO_BOOTSTRAP_ADMIN_PASSWORD:-wama-admin}"
      FORGEJO_ADMIN_USERNAME: "${FORGEJO_BOOTSTRAP_ADMIN_USERNAME:-wama-admin}"
      FORGEJO_MANAGED_REPOSITORIES: "${FORGEJO_MANAGED_REPOSITORIES:-processor-frequency-scale,processor-apparent-power,processor-frequency-iec104-export,processor-frequency-measurement-session,processor-alarm-threshold,gateway-c37-118}"
      FORGEJO_URL: http://forgejo:3000
      DRUID_DATASOURCE: live_measurements
      DRUID_EXPECTED_DOUBLE_VALUE: "${DRUID_EXPECTED_DOUBLE_VALUE:-50.01}"
      DRUID_EXPECTED_DOUBLE_VALUE_TOLERANCE: "${DRUID_EXPECTED_DOUBLE_VALUE_TOLERANCE:-0.01}"
      DRUID_EXPECTED_MRID: "${DRUID_EXPECTED_MRID:-urn:wama:poc:pmu:bay-01:frequency}"
      DRUID_ROUTER_URL: http://druid:8888
      DRUID_SUPERVISOR_ID: live_measurements
      IEC104_BROWSER_URL: http://iec104-browser:8080
      MEASUREMENT_SESSION_API_URL: http://measurement-session-api:8080
      MEASUREMENT_SESSION_EXPORTER_URL: http://measurement-session-exporter:8080
      MAILPIT_URL: http://mailpit:8025
      BLOBMETA_TOPIC_PARTITIONS: "${BLOBMETA_TOPIC_PARTITIONS:-12}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUME_TIMEOUT_SECONDS: "${INFRA_READINESS_KAFKA_CONSUME_TIMEOUT_SECONDS:-12}"
      KAFKA_TOPIC: LiveMeasurement
      REQUIRE_LIVE_MEASUREMENT: "${INFRA_READINESS_REQUIRE_LIVE_MEASUREMENT:-false}"
      MEASUREMENT_SESSION_TOPIC_PARTITIONS: "${MEASUREMENT_SESSION_TOPIC_PARTITIONS:-12}"
      PMU_EXPECTED_MRID_PREFIX: "${PMU_EXPECTED_MRID_PREFIX:-urn:wama:poc:pmu:}"
      POSTGRES_DATABASE: wama
      POSTGRES_DSN: postgresql://wama:wama-postgres-password@postgres:5432/wama
      POSTGRES_USER: wama
      READINESS_RETRY_INTERVAL_SECONDS: "${INFRA_READINESS_RETRY_INTERVAL_SECONDS:-2}"
      READINESS_TIMEOUT_SECONDS: "${INFRA_READINESS_TIMEOUT_SECONDS:-180}"
      TRINO_BLOBMETA_CATALOG: blobmeta
      TRINO_BLOBMETA_SCHEMA: blobmeta_catalog
      TRINO_DRUID_CATALOG: druid
      TRINO_DRUID_SCHEMA: druid
      TRINO_SESSION_CATALOG: sessions
      TRINO_SESSION_SCHEMA: wama
      TRINO_SESSION_TABLE: measurement_values
      TRINO_URL: http://trino:8080
      TRINO_USER: wama
      S3_ACCESS_KEY_ID: wama-s3-admin
      S3_BUCKETS: wama-raw,wama-measurement-sessions
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: wama-s3-admin-secret
      VICTORIA_METRICS_URL: http://victoria-metrics:8428
      GRAFANA_URL: http://grafana:3000
    restart: "no"