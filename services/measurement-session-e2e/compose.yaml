services:
  measurement-session-e2e:
    profiles:
      - measurement-session-test
    build:
      context: ../..
      dockerfile: services/measurement-session-e2e/Dockerfile
    env_file:
      - ../grafana/grafana.env
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      measurement-session-processor:
        condition: service_started
      blobmeta-catalog:
        condition: service_started
      measurement-session-query-indexer:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      trino:
        condition: service_healthy
      trino-session-init:
        condition: service_completed_successfully
      grafana:
        condition: service_healthy
    environment:
      BLOBMETA_TOPIC: Blobmeta
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUME_TIMEOUT_SECONDS: "${MEASUREMENT_SESSION_E2E_KAFKA_TIMEOUT_SECONDS:-30}"
      MEASUREMENT_SESSION_COMPLETE_ID: "${MEASUREMENT_SESSION_COMPLETE_ID:-}"
      MEASUREMENT_SESSION_PARTIAL_ID: "${MEASUREMENT_SESSION_PARTIAL_ID:-}"
      MEASUREMENT_SESSION_TEST_MISSING_MRID: "${MEASUREMENT_SESSION_TEST_MISSING_MRID:-urn:wama:poc:missing}"
      MEASUREMENT_SESSION_TEST_MRID: "${MEASUREMENT_SESSION_TEST_MRID:-urn:wama:poc:pmu:bay-01:frequency}"
      GRAFANA_URL: http://grafana:3000
      MEASUREMENT_SESSION_TOPIC: MeasurementSession
      S3_ACCESS_KEY_ID: wama-s3-admin
      S3_BUCKET: wama-measurement-sessions
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: wama-s3-admin-secret
      TIMEOUT_SECONDS: "${MEASUREMENT_SESSION_E2E_TIMEOUT_SECONDS:-60}"
      TRINO_BLOBMETA_CATALOG: blobmeta
      TRINO_BLOBMETA_SCHEMA: blobmeta_catalog
      TRINO_DRUID_CATALOG: druid
      TRINO_DRUID_SCHEMA: druid
      TRINO_DRUID_TABLE: live_measurements
      TRINO_QUERY_INDEX_SCHEMA: session_query_index
      TRINO_QUERY_INDEX_TABLE: registrations
      TRINO_URL: http://trino:8080
      TRINO_USER: measurement-session-e2e
    restart: "no"