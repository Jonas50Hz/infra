name: Validate WAMA infrastructure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose assembly
        run: docker compose config --quiet
      - name: Test Druid image and helpers
        run: |
          docker build --target test --file services/druid/Dockerfile .
          docker compose build grafana druid druid-init infra-readiness
          docker compose run --rm --no-deps druid-init python -m unittest discover -s /app/tests -v
          docker compose run --rm --no-deps infra-readiness python -m unittest discover -s /app/tests -v
      - name: Verify Druid PMU ingestion
        run: scripts/test-druid-ingestion.sh
      - name: Verify Grafana PMU dashboard
        run: scripts/test-grafana-pmu-dashboard.sh
      - name: Test finalized-session images
        run: |
          docker build --target test --file services/measurement-session-exporter/Dockerfile .
          docker build --target test --file services/measurement-session-api/Dockerfile .
          docker build --target test --file services/measurement-session-browser/Dockerfile .
          docker build --target test --file services/measurement-session-e2e/Dockerfile .
      - name: Verify contract to browser download
        run: scripts/test-measurement-session-flow.sh
      - name: Remove test infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans