syntax = "proto3";

package wama.measurement_session.v1;

import "google/protobuf/timestamp.proto";

// A request to materialize a bounded historical measurement session. The
// completed artifact is described separately on the compacted Blobmeta topic.
message MeasurementSessionRequest {
    // Canonical UUID supplied by the request producer.
    string session_id = 1;

    // The timestamp at which this immutable request was produced.
    google.protobuf.Timestamp requested_at = 2;

    // The requested UTC half-open measurement interval [started_at, ended_at).
    google.protobuf.Timestamp started_at = 3;
    google.protobuf.Timestamp ended_at = 4;

    // Bounded, sorted, unique MRIDs requested for the session artifact.
    repeated string mrids = 5;

    // Bounded, sorted context entries.
    repeated MetadataEntry metadata = 6;
}

message MetadataEntry {
    string key = 1;
    string value = 2;
}