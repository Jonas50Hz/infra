syntax = "proto3";

package wama.iec104.v1;

import "google/protobuf/timestamp.proto";

// One immutable request to send an outbound IEC 60870-5-104 ASDU.
//
// This message is serialized as raw Protobuf on the Export Kafka topic. It
// deliberately carries ASDU semantics only: APDU framing, TCP state, and IEC
// 104 sequence numbers are owned by the exporter transport implementation.
message ExportRecord {
    // Canonical UUID used as both the record identity and Kafka message key.
    string export_id = 1;

    // UTC creation time of this export request. Producers use the same instant
    // as the Kafka record timestamp.
    google.protobuf.Timestamp created_at = 2;

    // The selected outbound target. Future export targets use new oneof fields
    // rather than placing unrelated payload types on the same topic.
    oneof target {
        Iec104Asdu iec104_asdu = 10;
    }

    reserved 3 to 9;
}

// The supported monitor-direction IEC 104 ASDU type identifiers.
enum Iec104TypeId {
    IEC104_TYPE_ID_UNSPECIFIED = 0;
    IEC104_TYPE_ID_M_SP_NA_1 = 1;
    IEC104_TYPE_ID_M_DP_NA_1 = 3;
    IEC104_TYPE_ID_M_ME_NC_1 = 13;
}

// One complete ASDU header and its information objects.
message Iec104Asdu {
    Iec104TypeId type_id = 1;

    // The two-octet IEC 104 common address.
    uint32 common_address = 2;

    Iec104CauseOfTransmission cause = 3;

    // The exporter derives the VSQ object count and sequence-addressing bit
    // from this ordered list.
    repeated Iec104InformationObject information_objects = 4;

    reserved 5 to 9;
}

// The cause-of-transmission code for a monitor-direction ASDU.
message Iec104CauseOfTransmission {
    // IEC 101 cause code, encoded in the low six bits of the first COT octet.
    uint32 code = 1;

    // c104 owns the remaining COT encoding and sends its monitor-direction
    // defaults: originator address 0, test false, and negative confirmation
    // false. Reserve this range for a future transport that supports explicit
    // encoding of those fields.
    reserved 2 to 9;
}

// An IEC 104 information object with its three-octet address and typed value.
message Iec104InformationObject {
    // IEC 104 information-object address in the inclusive range 1..16777215.
    uint32 information_object_address = 1;

    oneof value {
        Iec104SinglePoint single_point = 10;
        Iec104DoublePoint double_point = 11;
        Iec104ShortFloat short_float = 12;
    }

    reserved 2 to 9;
}

// A monitor-direction single-point value for M_SP_NA_1.
message Iec104SinglePoint {
    bool value = 1;
    Iec104Quality quality = 2;
}

// The two-bit double-point information element for M_DP_NA_1.
enum Iec104DoublePointState {
    IEC104_DOUBLE_POINT_INTERMEDIATE = 0;
    IEC104_DOUBLE_POINT_OFF = 1;
    IEC104_DOUBLE_POINT_ON = 2;
    IEC104_DOUBLE_POINT_INDETERMINATE = 3;
}

// A monitor-direction double-point value for M_DP_NA_1.
message Iec104DoublePoint {
    Iec104DoublePointState value = 1;
    Iec104Quality quality = 2;
}

// An IEEE 754 short-float value for M_ME_NC_1.
message Iec104ShortFloat {
    float value = 1;
    Iec104Quality quality = 2;
}

// IEC quality descriptor bits used by the monitor-direction baseline.
message Iec104Quality {
    bool invalid = 1;
    bool not_topical = 2;
    bool substituted = 3;
    bool blocked = 4;

    // The QDS overflow bit. It is valid only for M_ME_NC_1.
    bool overflow = 5;
}